[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
default-run = "app"
edition = "2021"
rust-version = "1.79.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri-plugin-store = { version = "2" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon",
] }
reqwest = { version = "0.12.9", features = ["json", "blocking"] }
tokio = { version = "1", features = ["full"] }
# WebSocket client for Supabase Realtime (Phoenix channel protocol)
tungstenite = { version = "0.24", features = ["native-tls"] }
# Cross-platform app data directory resolution (macOS, Windows, Linux)
directories = "5.0"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"

[features]
# DO NOT REMOVE — used for production/static builds
custom-protocol = ["tauri/custom-protocol"]
